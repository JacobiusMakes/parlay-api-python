name: Langflow native example

on:
  pull_request:
    paths:
      - "examples/langflow/**"
      - ".github/workflows/langflow-native.yml"

permissions:
  contents: read

jobs:
  native-example:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LANGFLOW_AUTO_LOGIN: "true"
      LANGFLOW_HOST: "127.0.0.1"
      LANGFLOW_PORT: "7860"
      LANGFLOW_WORKERS: "1"
      LANGFLOW_OPEN_BROWSER: "false"
      LANGFLOW_DO_NOT_TRACK: "true"
      DO_NOT_TRACK: "true"
      LANGFLOW_CREATE_STARTER_PROJECTS: "false"
    steps:
      - name: Set isolated runtime paths
        run: |
          echo "NATIVE_ARTIFACTS=$RUNNER_TEMP/langflow-native-artifacts" >> "$GITHUB_ENV"
          echo "LANGFLOW_CONFIG_DIR=$RUNNER_TEMP/langflow-native-state" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install published native runtime and browser
        timeout-minutes: 11
        run: |
          python -m pip install uv==0.12.10
          uv pip install --system langflow==1.12.0 langflow-base==1.12.0 lfx==1.12.0 jq==1.10.0 playwright==1.62.0
          python -m playwright install --with-deps chromium
      - name: Check example and native harness assertions
        run: |
          python -m unittest discover -s examples/langflow -p 'test_*.py' -v
          python -m unittest discover -s examples/langflow/ci -p 'test_*.py' -v
      - name: Import, run synthetic flow, and capture native editor
        timeout-minutes: 7
        run: bash examples/langflow/ci/run_native.sh
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: langflow-native-${{ github.run_id }}
          path: ${{ runner.temp }}/langflow-native-artifacts
          if-no-files-found: warn
          retention-days: 7
